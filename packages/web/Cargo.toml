[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
web-sys = { version = "0.3.98", features = ["Window", "Storage", "console"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "ui/server"]

[lints]
workspace = true
