[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
web-sys = { version = "0.3.98", features = ["Window", "Storage", "console", "Location"] }

[features]
default = []
web = ["dioxus/web"]

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
