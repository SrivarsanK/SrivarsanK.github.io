[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
reqwest = { version = "0.13.3", features = ["json"], optional = true }
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }

[features]
server = ["dioxus/server", "dep:reqwest"]

[lints]
workspace = true
