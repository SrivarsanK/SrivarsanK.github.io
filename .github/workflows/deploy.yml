name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Astro portfolio
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          # The build reads each project's star count from GitHub.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh portfolio from GitHub
        run: python3 scripts/sync_portfolio.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "dioxus-web"

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.9

      - name: Build Dioxus Web App
        run: dx build --release --platform web --package web
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Assemble and check Pages output
        run: |
          mkdir -p dist/desktop
          cp -a target/dx/web/release/web/public/. dist/desktop/
          sed -i 's#</head>#<meta name="robots" content="noindex"></head>#' dist/desktop/index.html
          if test -f dist/about.html/index.html; then
            mv dist/about.html/index.html dist/about-page.html
            rmdir dist/about.html
            mv dist/about-page.html dist/about.html
          fi
          test -f dist/about.html
          test -f dist/projects/nexus-solo/index.html
          test -f dist/projects/ridesuraksha/index.html
          test -f dist/media/projects/glide.webp
          grep -q 'id="path"' dist/index.html
          test -f dist/google57407e739a6d98db.html
          test -f dist/media/srivarsan-hero.webp
          grep -q 'github.com/SrivarsanK/aws_a4b' dist/projects/nexus-solo/index.html
          grep -q 'https://srivarsank.github.io/projects/nexus-solo/' dist/sitemap.xml
          grep -q '/desktop/' dist/desktop/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
