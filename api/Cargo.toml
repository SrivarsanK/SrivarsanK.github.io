[package]
name = "api-contact"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "contact"
path = "contact.rs"

[[bin]]
name = "test_mail"
path = "test_mail.rs"

[[bin]]
name = "dev_server"
path = "dev_server.rs"

[dependencies]
vercel_runtime = "2"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
shared = { path = "../packages/shared" }
http = "1"
http-body-util = "0.1"
dotenvy = "0.15"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
